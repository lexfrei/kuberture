name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # Validate before building
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0
          args: --timeout=5m

      - name: Run tests
        run: go test --verbose --race ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # Build and push container images
  build-and-push:
    name: Build and Push (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and Push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,scope=build-${{ matrix.arch }},mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir --parents /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge multi-arch manifests
  merge-manifests:
    name: Merge Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}"

          # Build image references array
          images=()
          for digest_file in *; do
            [[ -f "$digest_file" ]] || continue
            images+=("${IMAGE_NAME}@sha256:${digest_file}")
          done

          # Create multi-arch manifest with version tag and latest
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            "${images[@]}"

      - name: Inspect image
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${VERSION}"

  # Build and release Helm chart
  release-chart:
    name: Release Chart
    runs-on: ubuntu-latest
    needs: merge-manifests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Update Chart.yaml and values.yaml
        run: |
          set -euo pipefail

          VERSION="${{ needs.merge-manifests.outputs.version }}"
          CHART_DIR="chart"
          IMAGE_REPO="ghcr.io/${{ github.repository }}"

          # Update Chart.yaml
          sed -i "s/^version: .*/version: \"${VERSION}\"/" "${CHART_DIR}/Chart.yaml"
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" "${CHART_DIR}/Chart.yaml"

          # Update values.yaml
          sed -i "s|repository: .*|repository: ${IMAGE_REPO}|" "${CHART_DIR}/values.yaml"
          sed -i "s/tag: .*/tag: \"${VERSION}\"/" "${CHART_DIR}/values.yaml"

          echo "Chart version: ${VERSION}"
          echo "Image: ${IMAGE_REPO}:${VERSION}"

      - name: Package chart
        run: |
          set -euo pipefail

          helm package chart/

          ls -lh *.tgz

      - name: Push chart to GHCR
        run: |
          set -euo pipefail

          VERSION="${{ needs.merge-manifests.outputs.version }}"
          CHART_PKG="kuberture-${VERSION}.tgz"

          helm push "${CHART_PKG}" oci://ghcr.io/${{ github.repository }}/charts

          echo "Chart pushed to: oci://ghcr.io/${{ github.repository }}/charts/kuberture:${VERSION}"

  # Create GitHub release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [merge-manifests, release-chart]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container Image

            ```bash
            podman pull ghcr.io/${{ github.repository }}:${{ needs.merge-manifests.outputs.version }}
            ```

            ## Helm Chart

            ```bash
            helm install kuberture \
              oci://ghcr.io/${{ github.repository }}/charts/kuberture \
              --version ${{ needs.merge-manifests.outputs.version }}
            ```

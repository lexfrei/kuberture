name: PR Checks and Build

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: write

jobs:
  # Linting
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9.0
          args: --timeout=5m

  # Testing
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests
        run: go test --verbose --race --coverprofile=coverage.out --covermode=atomic ./...

      - name: Upload coverage
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  # E2E tests with kind
  e2e:
    name: E2E Tests
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Run E2E tests
        run: make e2e

  # Build containers only after lint, test, and e2e succeed
  build-and-push:
    name: Build and Push (${{ matrix.arch }})
    needs: [lint, test, e2e]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push to ttl.sh by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ttl.sh/kuberture,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,scope=build-${{ matrix.arch }},mode=max
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
            REVISION=${{ github.event.pull_request.head.sha }}

      - name: Export digest
        run: |
          mkdir --parents /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge multi-arch manifests
  merge-manifests:
    name: Merge Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          IMAGE_NAME="ttl.sh/kuberture"
          TAG="pr-${PR_NUMBER}-1d"

          # Build image references array
          images=()
          for digest_file in *; do
            [[ -f "$digest_file" ]] || continue
            images+=("${IMAGE_NAME}@sha256:${digest_file}")
          done

          # Create multi-arch manifest
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${TAG}" \
            "${images[@]}"

      - name: Inspect image
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          docker buildx imagetools inspect "ttl.sh/kuberture:pr-${PR_NUMBER}-1d"

      - name: Generate build summary
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          IMAGE_TAG="ttl.sh/kuberture:pr-${PR_NUMBER}-1d"

          {
            echo "## Multi-arch Container Image"
            echo ""
            echo "### Image Tag"
            echo "- \`${IMAGE_TAG}\`"
            echo ""
            echo "### Platforms"
            echo "- linux/amd64"
            echo "- linux/arm64"
            echo ""
            echo "### Pull Command"
            echo '```bash'
            echo "podman pull ${IMAGE_TAG}"
            echo '```'
            echo ""
            echo "> **Note:** Image expires in 24 hours (ttl.sh)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Lint Helm chart
  lint-chart:
    name: Lint Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Run Helm Lint
        run: |
          echo "Running Helm lint..."
          helm lint chart/ \
            --set 'config.outputs[0].name=lint-test' \
            --set 'config.outputs[0].hostname[0]=test.example.com' \
            --set 'config.outputs[0].serviceName=lint-svc'

      - name: Template Chart
        run: |
          echo "Testing chart templating..."
          helm template test-release chart/ \
            --set 'config.outputs[0].name=tmpl-test' \
            --set 'config.outputs[0].hostname[0]=test.example.com' \
            --set 'config.outputs[0].serviceName=tmpl-svc'

  # Build and push Helm chart to ttl.sh
  build-chart:
    name: Build Chart
    runs-on: ubuntu-latest
    needs: [lint, test, e2e, lint-chart]
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Modify Chart.yaml and values.yaml
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          CHART_DIR="chart"
          CHART_VERSION="0.0.0-pr.${PR_NUMBER}-1d"
          APP_VERSION="pr-${PR_NUMBER}-1d"
          IMAGE_REPO="ttl.sh/kuberture"
          IMAGE_TAG="pr-${PR_NUMBER}-1d"

          # Update Chart.yaml
          sed -i "s/^version: .*/version: ${CHART_VERSION}/" "${CHART_DIR}/Chart.yaml"
          sed -i "s/^appVersion: .*/appVersion: \"${APP_VERSION}\"/" "${CHART_DIR}/Chart.yaml"

          # Update values.yaml
          sed -i "s|repository: .*|repository: ${IMAGE_REPO}|" "${CHART_DIR}/values.yaml"
          sed -i "s/tag: .*/tag: \"${IMAGE_TAG}\"/" "${CHART_DIR}/values.yaml"

          echo "Modified chart version: ${CHART_VERSION}"
          echo "Modified appVersion: ${APP_VERSION}"
          echo "Modified image: ${IMAGE_REPO}:${IMAGE_TAG}"

      - name: Package chart
        run: |
          set -euo pipefail

          helm package chart/

          # Show package info
          ls -lh *.tgz

      - name: Push chart to ttl.sh
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          CHART_VERSION="0.0.0-pr.${PR_NUMBER}-1d"
          CHART_PKG="kuberture-${CHART_VERSION}.tgz"

          # Push to ttl.sh OCI registry
          helm push "${CHART_PKG}" oci://ttl.sh/kuberture-charts

          echo "Chart pushed to: oci://ttl.sh/kuberture-charts/kuberture:${CHART_VERSION}"

      - name: Generate chart summary
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          CHART_VERSION="0.0.0-pr.${PR_NUMBER}-1d"

          {
            echo "## Helm Chart"
            echo ""
            echo "### Chart Version"
            echo "- \`${CHART_VERSION}\`"
            echo ""
            echo "### Install Command"
            echo '```bash'
            echo "helm install kuberture oci://ttl.sh/kuberture-charts/kuberture --version ${CHART_VERSION}"
            echo '```'
            echo ""
            echo "> **Note:** Chart expires in 24 hours (ttl.sh)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Comment on PR after all builds complete
  notify:
    name: Notify PR
    needs: [merge-manifests, build-chart]
    runs-on: ubuntu-latest
    steps:
      - name: Check if first build
        id: first_build
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const hasLabel = labels.data.some(label => label.name === 'Container Available');
            return hasLabel ? 'false' : 'true';

      - name: Add Container Available label
        if: steps.first_build.outputs.result == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['Container Available']
            })

      - name: Comment on PR (first time only)
        if: steps.first_build.outputs.result == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const imageTag = `ttl.sh/kuberture:pr-${prNumber}-1d`;
            const chartVersion = `0.0.0-pr.${prNumber}-1d`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Container image available\n\n**Multi-arch image (amd64 + arm64):**\n\`\`\`bash\npodman pull ${imageTag}\n\`\`\`\n\n## Helm chart available\n\n**Install chart:**\n\`\`\`bash\nhelm install kuberture oci://ttl.sh/kuberture-charts/kuberture --version ${chartVersion}\n\`\`\`\n\n> **Note:** Image and chart are rebuilt on every commit and expire after 24 hours (hosted on ttl.sh).`
            })

suite: ServiceAccount tests
templates:
  - templates/serviceaccount.yaml
release:
  name: kuberture
  namespace: default
tests:
  - it: should be created by default
    asserts:
      - isKind:
          of: ServiceAccount
      - isAPIVersion:
          of: v1
      - hasDocuments:
          count: 1

  - it: should not be created when serviceAccount.create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should have automountServiceAccountToken set to true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should have no annotations by default
    asserts:
      - notExists:
          path: metadata.annotations

  - it: should have annotations when specified
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/my-role
    asserts:
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/my-role

  - it: should use custom name when specified
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

suite: PDB tests
templates:
  - templates/pdb.yaml
release:
  name: kuberture
  namespace: default
chart:
  version: 0.1.0
  appVersion: "0.1.0"
values:
  - test-values.yaml
tests:
  - it: should create PDB when replicaCount > 1
    set:
      replicaCount: 3
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - isAPIVersion:
          of: policy/v1
      - equal:
          path: metadata.name
          value: kuberture
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: kuberture
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: kuberture

  - it: should not create PDB when replicaCount is 1
    set:
      replicaCount: 1
    asserts:
      - hasDocuments:
          count: 0
